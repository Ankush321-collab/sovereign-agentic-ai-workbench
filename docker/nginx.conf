# Sovereign AI Workbench — Nginx Frontend & Reverse Proxy Configuration

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Maximum file upload size for documents, images, and datasets
    client_max_body_size 128M;

    # Gzip compression for fast static asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Frontend Static Assets & Client-Side Routing ──────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend Reverse Proxy Endpoints ───────────────────────────────────────
    # Chat endpoint (streaming enabled, buffering disabled for realtime LLM tokens)
    location /chat {
        proxy_pass http://backend:8000/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering to stream LLM generation in real time
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # File upload endpoint
    location /upload {
        proxy_pass http://backend:8000/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    # Model routing status & history
    location /routing {
        proxy_pass http://backend:8000/routing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Air-gap network telemetry endpoint
    location /network {
        proxy_pass http://backend:8000/network;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Generated files list & downloads
    location /files {
        proxy_pass http://backend:8000/files;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # RAG search & indexing
    location /rag {
        proxy_pass http://backend:8000/rag;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Multimodal OCR & Vision
    location /multimodal {
        proxy_pass http://backend:8000/multimodal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    # OpenAPI docs & Swagger UI
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Generic /api/ prefix forwarding
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
