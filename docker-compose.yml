# ==============================================================================
# Sovereign AI Workbench — Docker Compose Multi-Container Orchestration
# Air-Gapped / On-Premise Multi-Model Agentic System
# ==============================================================================

version: "3.8"

services:
  # ── 1. Backend Service (FastAPI + LangGraph + MarkItDown + RAG) ────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sovereign-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - ROUTER_SERVICE_URL=inprocess
      - SARVAM_SERVICE_URL=${SARVAM_SERVICE_URL:-http://host.docker.internal:8001}
      - SARVAM_ENDPOINT=${SARVAM_ENDPOINT:-http://host.docker.internal:8001}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Mount data folder for persistent uploads, vector index, and outputs
      - ./data:/app/data
      # Mount host HuggingFace cache for local offline sentence-transformers embeddings
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - sovereign-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 2. Frontend Service (React SPA + Nginx Reverse Proxy) ──────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ""
        VITE_USE_MOCK: "false"
    container_name: sovereign-frontend
    restart: unless-stopped
    ports:
      # Port 5173 for familiar Vite development access & Port 80 for production HTTP
      - "5173:80"
      - "80:80"
    networks:
      - sovereign-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 3s
      retries: 3

  # ── 3. Ollama is running on the Windows HOST machine ───────────────────────
  # Models available on host: qwen2.5vl:7b, qwen2.5:7b-instruct, qwen2.5-coder:latest
  # The backend uses host.docker.internal:11434 to reach it — no container needed.
  # Run `ollama serve` on your Windows machine before starting Docker Compose.

# ── Isolated Air-Gapped Network ───────────────────────────────────────────────
networks:
  sovereign-net:
    name: sovereign-net
    driver: bridge
